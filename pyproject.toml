[project]
name = "Lianjia-Housing-Analysis"
version = "0.1.0"
description = "链家租房数据分析项目"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Yokumi", email = "KemingZhang@bupt.edu.cn" },
]
license = { text = "MIT" }

dependencies = [
    "requests>=2.28.0",
    "lxml>=4.9.0",
    "cssselect>=1.2.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
selenium = [
    "selenium>=4.0.0",
    "webdriver-manager>=3.8.0",
]
drission = [
    "drissionpage>=4.0.0",
]
analysis = [
    "numpy>=1.20.0",
    "scipy>=1.9.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "folium>=0.14.0",
    "contextily>=1.3.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=5.0.0",
]

[project.scripts]
lianjia-spider = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
